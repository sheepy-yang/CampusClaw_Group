schema: spec-driven

context: |
  Product: CampusClaw intelligent teaching workflow extension.
  Current phase: Lesson 7 project bootstrap; build a runnable skeleton without teaching business logic.
  Stack: React 18 + TypeScript + Vite, Go 1.22 net/http, MySQL 8, Redis 7, Qdrant, MinIO, Nginx and Docker Compose.
  Architecture: Transport -> Application -> Domain/Port; infrastructure adapters implement ports.
  Security: server-side authentication, role authorization, class isolation and server-only secrets.
  Delivery: only Nginx is exposed; GET /health reports API dependency connectivity.

rules:
  proposal:
    - State users, value, scope and explicit non-goals.
  design:
    - Record dependency direction, trust boundaries, alternatives and failure semantics.
  specs:
    - Every Requirement must include independently testable Given/When/Then Scenarios.
    - Include invalid input, unauthenticated, forbidden, not found and dependency unavailable paths.
  tasks:
    - Put skeleton tasks before business tasks.
    - Every task must include an executable verification command or observable check.
    - Keep a checkbox unchecked until its verification has passed.

operations:
  apply:
    guidance:
      - Implement and verify one task at a time.
      - Do not implement the twelve teaching capabilities during the skeleton change.
      - Never use client-side visibility as authorization.
  archive:
    guidance:
      - Archive only after strict validation, clean-machine startup and peer review pass.
