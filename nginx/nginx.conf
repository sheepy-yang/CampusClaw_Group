# 浏览器只访问 Nginx；后端与数据服务不直接暴露。
# 骨架配置：待 web / api 容器就绪后启用。

worker_processes 1;

events {
  worker_connections 1024;
}

http {
  upstream api {
    server api:8080;
  }

  upstream web {
    server web:80;
  }

  server {
    listen 80;

    location /api/ {
      proxy_pass http://api;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
      proxy_pass http://web;
    }
  }
}
