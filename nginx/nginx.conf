# This file is rendered by the official Nginx image as a conf.d template.
# NGINX_ENVSUBST_FILTER restricts substitution to API_PORT so Nginx variables remain intact.

upstream campusclaw_api {
  server api:${API_PORT};
}

upstream campusclaw_web {
  server web:80;
}

map $http_x_request_id $correlation_id {
  default $request_id;
  "~^[A-Za-z0-9._-]{1,128}$" $http_x_request_id;
}

log_format campusclaw_json escape=json
  '{"time":"$time_iso8601","level":"INFO","service":"nginx",'
  '"event":"http_request","request_id":"$correlation_id","method":"$request_method",'
  '"path":"$uri","status":$status,"duration_seconds":$request_time}';

server {
  listen 80;
  server_name _;
  client_max_body_size 20m;
  access_log /var/log/nginx/access.log campusclaw_json;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header X-Request-ID $correlation_id always;

  location = /health {
    proxy_pass http://campusclaw_api;
    proxy_hide_header X-Request-ID;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Request-ID $correlation_id;
  }

  location /api/ {
    proxy_pass http://campusclaw_api;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 300s;
    proxy_hide_header X-Request-ID;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Request-ID $correlation_id;
  }

  location / {
    proxy_pass http://campusclaw_web;
    proxy_set_header Host $host;
    proxy_set_header X-Request-ID $correlation_id;
  }
}
