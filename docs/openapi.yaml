openapi: 3.0.3
info:
  title: CampusClaw Group API
  version: 1.0.0
  description: API actually registered on the main Go HTTP mux.
servers:
  - url: /
security:
  - bearerAuth: []
tags:
  - { name: Auth }
  - { name: Materials }
  - { name: Assistant }
  - { name: Assignments }
  - { name: Content }
  - { name: Skills }
  - { name: Tutoring }
  - { name: Classroom }
  - { name: Tasks }
  - { name: Attachments }
  - { name: MCP }
  - { name: Audit }
paths:
  /api/v1/auth/login:
    post:
      tags: [Auth]
      security: []
      summary: Create an expiring session
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: Revoke the current session
      responses:
        "200":
          description: Revoked
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties: { ok: { type: string, enum: ["true"] } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/auth/me:
    get:
      tags: [Auth]
      summary: Get the authenticated principal
      responses:
        "200":
          description: Current principal
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Principal" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/classes/{classID}/materials:
    parameters:
      - $ref: "#/components/parameters/ClassID"
    get:
      tags: [Materials]
      summary: List materials in the current class
      responses:
        "200":
          description: Material summaries
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Material" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Materials]
      summary: Ingest and index text material (teacher)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateMaterialRequest" }
      responses:
        "201":
          description: Indexed material
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Material" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/v1/materials/{materialID}:
    parameters:
      - $ref: "#/components/parameters/MaterialID"
    get:
      tags: [Materials]
      summary: Get one class-scoped material
      responses:
        "200":
          description: Material
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Material" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/materials/{materialID}/chunks:
    parameters:
      - $ref: "#/components/parameters/MaterialID"
    get:
      tags: [Materials]
      summary: Get immutable chunks for a material
      responses:
        "200":
          description: Material chunks
          content:
            application/json:
              schema:
                type: object
                required: [materialId, version, chunks]
                properties:
                  materialId: { type: string }
                  version: { type: string }
                  chunks:
                    type: array
                    items: { $ref: "#/components/schemas/Chunk" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/classes/{classID}/search:
    parameters:
      - $ref: "#/components/parameters/ClassID"
    post:
      tags: [Materials]
      summary: Search class-scoped material chunks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [query]
              properties:
                query: { type: string, maxLength: 500 }
                limit: { type: integer, minimum: 1, maximum: 20, default: 5 }
      responses:
        "200":
          description: Retrieval hits
          content:
            application/json:
              schema:
                type: object
                required: [retrievalRunId, hits]
                properties:
                  retrievalRunId: { type: string }
                  hits:
                    type: array
                    items: { $ref: "#/components/schemas/Chunk" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /api/v1/classes/{classID}/assistant:
    parameters:
      - $ref: "#/components/parameters/ClassID"
    get:
      tags: [Assistant]
      summary: Get class assistant configuration
      responses:
        "200":
          description: Assistant configuration
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Assistant" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Assistant]
      summary: Update class assistant configuration (teacher)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateAssistantRequest" }
      responses:
        "200":
          description: Saved assistant configuration
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Assistant" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/v1/conversations:
    get:
      tags: [Assistant]
      summary: List own conversations, or all class conversations for a teacher
      parameters:
        - name: all
          in: query
          description: Teachers may pass true to list all class conversations.
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Conversations
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Conversation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/classes/{classID}/conversations:
    parameters:
      - $ref: "#/components/parameters/ClassID"
    post:
      tags: [Assistant]
      summary: Create a conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                title: { type: string, maxLength: 120 }
      responses:
        "201":
          description: Conversation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Conversation" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/v1/conversations/{conversationID}:
    parameters:
      - $ref: "#/components/parameters/ConversationID"
    get:
      tags: [Assistant]
      summary: Get an authorized conversation
      responses:
        "200":
          description: Conversation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Conversation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/conversations/{conversationID}/messages:
    parameters:
      - $ref: "#/components/parameters/ConversationID"
    post:
      tags: [Assistant]
      summary: Persist a grounded answer and stream SSE events
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [content]
              properties:
                content: { type: string, maxLength: 4000 }
                toolName: { type: string }
                toolArgs:
                  type: object
                  additionalProperties: true
      responses:
        "200":
          description: metadata, citations, optional tool, delta and done events
          content:
            text/event-stream:
              schema: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /api/v1/classes/{classID}/assignments:
    parameters:
      - $ref: "#/components/parameters/ClassID"
    get:
      tags: [Assignments]
      summary: List class assignments; students see published assignments without answers
      responses:
        "200":
          description: Assignments
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Assignment" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Assignments]
      summary: Create a draft assignment (teacher)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateAssignmentRequest" }
      responses:
        "201":
          description: Draft assignment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Assignment" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/v1/assignments/{assignmentID}:
    parameters:
      - $ref: "#/components/parameters/AssignmentID"
    get:
      tags: [Assignments]
      summary: Get one assignment; student responses omit answers
      responses:
        "200":
          description: Assignment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Assignment" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/assignments/{assignmentID}/publish:
    parameters:
      - $ref: "#/components/parameters/AssignmentID"
    post:
      tags: [Assignments]
      summary: Publish a valid draft assignment (teacher)
      responses:
        "200":
          description: Published assignment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Assignment" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/v1/assignments/{assignmentID}/submissions:
    parameters:
      - $ref: "#/components/parameters/AssignmentID"
      - $ref: "#/components/parameters/IdempotencyKey"
    post:
      tags: [Assignments]
      summary: Save a student submission and enqueue grading
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssignmentSubmissionRequest" }
      responses:
        "202":
          description: Submission accepted or idempotently replayed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskAccepted" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/v1/submissions/{submissionID}:
    parameters:
      - $ref: "#/components/parameters/SubmissionID"
    get:
      tags: [Assignments]
      summary: Get an authorized platform submission
      responses:
        "200":
          description: Submission
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Submission" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/submissions/{submissionID}/score:
    parameters:
      - $ref: "#/components/parameters/SubmissionID"
    post:
      tags: [Assignments]
      summary: Override a platform submission score (teacher)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [score, note]
              properties:
                score: { type: number, minimum: 0 }
                note: { type: string, maxLength: 500 }
      responses:
        "200":
          description: Updated submission
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Submission" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/v1/submissions/{submissionID}/mistake-explanation:
    parameters:
      - $ref: "#/components/parameters/SubmissionID"
    get:
      tags: [Assignments]
      summary: Get answer-safe mistake guidance
      responses:
        "200":
          description: Mistake guidance
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MistakeExplanation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/tasks/{taskID}:
    parameters:
      - $ref: "#/components/parameters/TaskID"
    get:
      tags: [Tasks]
      summary: Poll an authorized task
      responses:
        "200":
          description: Task state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/tasks/{taskID}/retry:
    parameters:
      - $ref: "#/components/parameters/TaskID"
    post:
      tags: [Tasks]
      summary: Requeue a failed assignment-grade or virtual-classroom task
      responses:
        "202":
          description: Retry accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /api/v1/attachments:
    post:
      tags: [Attachments]
      summary: Upload exactly one JPEG, PNG or WebP answer image
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "201":
          description: Stored attachment metadata; object key is not exposed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AttachmentReceipt" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "413":
          description: File exceeds 10 MiB
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /api/v1/skills/preview-sheet:
    post:
      tags: [Skills]
      summary: Generate grounded course preview cards
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CourseCardsRequest" }
      responses: { "200": { $ref: "#/components/responses/GenerationResult" }, "201": { $ref: "#/components/responses/GenerationResult" }, "400": { $ref: "#/components/responses/BadRequest" }, "401": { $ref: "#/components/responses/Unauthorized" }, "403": { $ref: "#/components/responses/Forbidden" }, "409": { $ref: "#/components/responses/Conflict" }, "502": { $ref: "#/components/responses/BadGateway" }, "503": { $ref: "#/components/responses/Unavailable" } }
  /api/v1/skills/proposition:
    post:
      tags: [Skills]
      summary: Generate grounded exercises
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExercisesRequest" }
      responses: { "200": { $ref: "#/components/responses/GenerationResult" }, "201": { $ref: "#/components/responses/GenerationResult" }, "400": { $ref: "#/components/responses/BadRequest" }, "401": { $ref: "#/components/responses/Unauthorized" }, "403": { $ref: "#/components/responses/Forbidden" }, "409": { $ref: "#/components/responses/Conflict" }, "502": { $ref: "#/components/responses/BadGateway" }, "503": { $ref: "#/components/responses/Unavailable" } }
  /api/v1/skills/lesson-plan:
    post:
      tags: [Skills]
      summary: Generate a grounded lesson plan
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LessonPlanRequest" }
      responses: { "200": { $ref: "#/components/responses/GenerationResult" }, "201": { $ref: "#/components/responses/GenerationResult" }, "400": { $ref: "#/components/responses/BadRequest" }, "401": { $ref: "#/components/responses/Unauthorized" }, "403": { $ref: "#/components/responses/Forbidden" }, "409": { $ref: "#/components/responses/Conflict" }, "502": { $ref: "#/components/responses/BadGateway" }, "503": { $ref: "#/components/responses/Unavailable" } }
  /api/v1/skills/content-quality-review:
    post:
      tags: [Skills]
      summary: Review generated or supplied content quality
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QualityReviewRequest" }
      responses: { "200": { $ref: "#/components/responses/QualityReviewResult" }, "400": { $ref: "#/components/responses/BadRequest" }, "401": { $ref: "#/components/responses/Unauthorized" }, "403": { $ref: "#/components/responses/Forbidden" }, "404": { $ref: "#/components/responses/NotFound" }, "502": { $ref: "#/components/responses/BadGateway" }, "503": { $ref: "#/components/responses/Unavailable" } }
  /api/v1/content-production/course-cards:
    post:
      tags: [Content]
      summary: Dedicated alias for preview-card generation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CourseCardsRequest" }
      responses: { "200": { $ref: "#/components/responses/GenerationResult" }, "201": { $ref: "#/components/responses/GenerationResult" }, "400": { $ref: "#/components/responses/BadRequest" }, "401": { $ref: "#/components/responses/Unauthorized" }, "403": { $ref: "#/components/responses/Forbidden" }, "409": { $ref: "#/components/responses/Conflict" }, "502": { $ref: "#/components/responses/BadGateway" }, "503": { $ref: "#/components/responses/Unavailable" } }
  /api/v1/content-production/exercises:
    post:
      tags: [Content]
      summary: Dedicated alias for exercise generation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExercisesRequest" }
      responses: { "200": { $ref: "#/components/responses/GenerationResult" }, "201": { $ref: "#/components/responses/GenerationResult" }, "400": { $ref: "#/components/responses/BadRequest" }, "401": { $ref: "#/components/responses/Unauthorized" }, "403": { $ref: "#/components/responses/Forbidden" }, "409": { $ref: "#/components/responses/Conflict" }, "502": { $ref: "#/components/responses/BadGateway" }, "503": { $ref: "#/components/responses/Unavailable" } }
  /api/v1/content-production/lesson-plans:
    post:
      tags: [Content]
      summary: Dedicated alias for lesson-plan generation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LessonPlanRequest" }
      responses: { "200": { $ref: "#/components/responses/GenerationResult" }, "201": { $ref: "#/components/responses/GenerationResult" }, "400": { $ref: "#/components/responses/BadRequest" }, "401": { $ref: "#/components/responses/Unauthorized" }, "403": { $ref: "#/components/responses/Forbidden" }, "409": { $ref: "#/components/responses/Conflict" }, "502": { $ref: "#/components/responses/BadGateway" }, "503": { $ref: "#/components/responses/Unavailable" } }
  /api/v1/content-production/reviews:
    post:
      tags: [Content]
      summary: Dedicated alias for content quality review
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QualityReviewRequest" }
      responses: { "200": { $ref: "#/components/responses/QualityReviewResult" }, "400": { $ref: "#/components/responses/BadRequest" }, "401": { $ref: "#/components/responses/Unauthorized" }, "403": { $ref: "#/components/responses/Forbidden" }, "404": { $ref: "#/components/responses/NotFound" }, "502": { $ref: "#/components/responses/BadGateway" }, "503": { $ref: "#/components/responses/Unavailable" } }

  /api/v1/skills/virtual-classroom:
    post:
      tags: [Skills]
      summary: Queue a synthetic-role classroom rehearsal (teacher)
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [lessonPlanId, rounds]
              properties:
                lessonPlanId: { type: string }
                objective: { type: string }
                rounds: { type: integer, minimum: 1, maximum: 10 }
                previousSimulationId: { type: string }
      responses:
        "202":
          description: Simulation task accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /api/v1/skills/multimodal-grade:
    get:
      tags: [Skills]
      summary: List multimodal submissions (teacher)
      parameters:
        - name: assignmentId
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Submissions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Submission" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Skills]
      summary: Queue multimodal subjective grading (student)
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [assignmentId]
              properties:
                assignmentId: { type: string }
                answerText: { type: string }
