    post:
      tags: [Classroom]
      summary: Open a class-scoped interaction (teacher)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [prompt]
              properties: { prompt: { type: string } }
      responses:
        "201":
          description: Classroom interaction
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClassroomInteraction" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/v1/classroom/interactions/active:
    get:
      tags: [Classroom]
      summary: Get the active class interaction
      responses:
        "200":
          description: Active interaction wrapper
          content:
            application/json:
              schema:
                type: object
                properties: { interaction: { $ref: "#/components/schemas/ClassroomInteraction" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/v1/classroom/interactions/{sessionID}/close:
    parameters:
      - $ref: "#/components/parameters/SessionID"
    post:
      tags: [Classroom]
      summary: Close a classroom interaction (teacher)
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        "200":
          description: Closed interaction
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClassroomInteraction" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/v1/classroom/interactions/{sessionID}/analysis:
    parameters:
      - $ref: "#/components/parameters/SessionID"
    get:
      tags: [Classroom]
      summary: Get classroom cluster analysis
      responses:
        "200":
          description: Classroom analysis
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClassroomAnalysis" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/v1/skills/classroom-cluster/answer:
    post:
      tags: [Classroom]
      summary: Submit or replace an anonymous classroom answer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [sessionId, text]
              properties:
                sessionId: { type: string }
                text: { type: string }
      responses: { "200": { $ref: "#/components/responses/GenericSuccess" }, "400": { $ref: "#/components/responses/BadRequest" }, "401": { $ref: "#/components/responses/Unauthorized" }, "403": { $ref: "#/components/responses/Forbidden" }, "404": { $ref: "#/components/responses/NotFound" }, "409": { $ref: "#/components/responses/Conflict" }, "503": { $ref: "#/components/responses/Unavailable" } }
  /api/v1/skills/classroom-cluster:
    post:
      tags: [Classroom]
      summary: Cluster anonymous answers; fewer than five skips the model
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SessionRequest" }
      responses:
        "200":
          description: Cluster analysis or threshold result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClassroomAnalysis" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /api/v1/mcp/tools:
    get:
      tags: [MCP]
      summary: Discover role-filtered MCP tools
      responses:
        "200":
          description: Tool descriptors
          content:
            application/json:
              schema:
                type: object
                required: [tools]
                properties:
                  tools:
                    type: array
                    items: { $ref: "#/components/schemas/MCPTool" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/v1/mcp/tools/{tool}/call:
    parameters:
      - name: tool
        in: path
        required: true
        schema:
          type: string
          enum: [formula_verify, assignment_stats, student_mistakes]
    post:
      tags: [MCP]
      summary: Call an allowed MCP tool with server-scoped arguments
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [arguments]
              properties:
                arguments:
                  type: object
                  additionalProperties: true
      responses:
        "200":
          description: Tool result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MCPToolResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /api/v1/audit:
    get:
      tags: [Audit]
      summary: List current-class audit events (teacher)
      responses:
        "200":
          description: Audit events
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AuditEvent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
  parameters:
    ClassID: { name: classID, in: path, required: true, schema: { type: string } }
    MaterialID: { name: materialID, in: path, required: true, schema: { type: string } }
    ConversationID: { name: conversationID, in: path, required: true, schema: { type: string } }
    AssignmentID: { name: assignmentID, in: path, required: true, schema: { type: string } }
    SubmissionID: { name: submissionID, in: path, required: true, schema: { type: string } }
    TaskID: { name: taskID, in: path, required: true, schema: { type: string } }
    ContentID: { name: contentID, in: path, required: true, schema: { type: string } }
    ContentPathID: { name: id, in: path, required: true, schema: { type: string } }
    AttemptID: { name: attemptID, in: path, required: true, schema: { type: string } }
    PlanID: { name: planID, in: path, required: true, schema: { type: string } }
    StepID: { name: stepID, in: path, required: true, schema: { type: string } }
    SessionID: { name: sessionID, in: path, required: true, schema: { type: string } }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 8, maxLength: 128, pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]{7,127}$" }
    OptionalIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string, maxLength: 128 }
  schemas:
    GenericObject:
      type: object
      additionalProperties: true
    Error:
      type: object
      required: [code, message, request_id]
      properties:
        code: { type: string }
        message: { type: string }
        request_id: { type: string }
    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string, format: password }
    LoginResponse:
      type: object
      required: [token, user]
      properties:
        token: { type: string }
        user: { $ref: "#/components/schemas/Principal" }
    Principal:
      type: object
      required: [userId, classId, role, name]
      properties:
        userId: { type: string }
        classId: { type: string }
        role: { type: string, enum: [teacher, student] }
        name: { type: string }
    CreateMaterialRequest:
      type: object
      additionalProperties: false
      required: [title, content]
      properties:
        title: { type: string, maxLength: 120 }
        content: { type: string, maxLength: 100000 }
    Material:
      type: object
      required: [id, classId, title, version, contentHash, indexStatus, createdBy, createdAt]
      properties:
        id: { type: string }
        classId: { type: string }
        title: { type: string }
        content: { type: string }
        version: { type: string }
        contentHash: { type: string }
        indexStatus: { type: string, enum: [indexing, ready, failed] }
        embeddingModel: { type: string }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        chunks:
          type: array
          items: { $ref: "#/components/schemas/Chunk" }
    Chunk:
      type: object
      required: [id, materialId, materialVersion, index, characterStart, characterEnd, contentHash, text, source]
      properties:
        id: { type: string }
        materialId: { type: string }
        materialVersion: { type: string }
        index: { type: integer }
        characterStart: { type: integer }
        characterEnd: { type: integer }
        contentHash: { type: string }
        text: { type: string }
        source: { type: string }
        keywordScore: { type: number }
        vectorScore: { type: number }
        fusionScore: { type: number }
    UpdateAssistantRequest:
      type: object
      additionalProperties: false
      required: [name, systemPrompt, enabledSkills]
      properties:
        name: { type: string, maxLength: 80 }
        systemPrompt: { type: string, maxLength: 4000 }
        enabledSkills:
          type: array
          items: { type: string, enum: [rag_search, mistake_hint, formula_verify] }
    Assistant:
      type: object
      required: [id, classId, name, systemPrompt, enabledSkills, updatedBy, updatedAt]
      properties:
        id: { type: string }
        classId: { type: string }
        name: { type: string }
        systemPrompt: { type: string }
        enabledSkills:
          type: array
          items: { type: string }
        updatedBy: { type: string }
        updatedAt: { type: string, format: date-time }
    ConversationMessage:
      type: object
      required: [id, role, content, createdAt]
      properties:
        id: { type: string }
        role: { type: string, enum: [user, assistant] }
        content: { type: string }
        citations:
          type: array
          items: { $ref: "#/components/schemas/Chunk" }
        tool: { type: string }
        createdAt: { type: string, format: date-time }
    Conversation:
      type: object
      required: [id, classId, userId, assistantId, title, messages, createdAt, updatedAt]
      properties:
        id: { type: string }
        classId: { type: string }
        userId: { type: string }
        assistantId: { type: string }
        title: { type: string }
        messages:
          type: array
          items: { $ref: "#/components/schemas/ConversationMessage" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Question:
      type: object
      required: [stem, answer]
      properties:
        id: { type: string }
        stem: { type: string }
        type: { type: string }
        knowledgePoint: { type: string, maxLength: 100 }
        difficulty: { type: string }
        answer: { type: string, writeOnly: true }
        explanation: { type: string, writeOnly: true }
        citations:
          type: array
          items: { $ref: "#/components/schemas/GenericObject" }
        status: { type: string, enum: [draft, validated, reviewing, published, archived] }
        adopted: { type: boolean }
    CreateAssignmentRequest:
      type: object
      additionalProperties: false
      required: [title, items]
      properties:
        title: { type: string, maxLength: 160 }
        description: { type: string }
        maxScore: { type: number, minimum: 0, maximum: 10000, default: 10 }
        items:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: "#/components/schemas/Question" }
    Assignment:
      type: object
      required: [id, classId, title, status, maxScore, items, createdBy, createdAt]
      properties:
        id: { type: string }
        classId: { type: string }
        title: { type: string }
        description: { type: string }
        status: { type: string, enum: [draft, published] }
        maxScore: { type: number }
        items:
          type: array
          items: { $ref: "#/components/schemas/Question" }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        publishedAt: { type: string, format: date-time }
    AssignmentSubmissionRequest:
      type: object
      additionalProperties: false
      properties:
        answerText: { type: string }
        answers:
          type: object
          additionalProperties: { type: string, maxLength: 20000 }
    TaskAccepted:
      type: object
      required: [taskId, submissionId, status, duplicate]
      properties:
        taskId: { type: string }
        submissionId: { type: string }
        status: { $ref: "#/components/schemas/TaskStatus" }
        duplicate: { type: boolean }
    TaskStatus:
      type: string
      description: Union of task states emitted by platform, evaluation, and teaching pipelines.
      enum: [pending, queued, running, pending_confirmation, succeeded, failed, not_started, step_running, step_finished]
    TaskStepStatus:
      type: string
      enum: [pending, queued, running, succeeded, failed, done, intercepted, not_started, step_running, step_finished]
    Task:
      type: object
      required: [id, status]
      properties:
        id: { type: string }
        skill: { type: string }
        classId: { type: string }
        userId: { type: string }
        objectId: { type: string }
        status: { $ref: "#/components/schemas/TaskStatus" }
        error: { type: string }
        idempotencyKey: { type: string }
        payloadHash: { type: string }
        traceId: { type: string }
        steps:
          type: array
          items:
            type: object
            required: [name, status]
            properties:
              name: { type: string }
              status: { $ref: "#/components/schemas/TaskStepStatus" }
              attempt: { type: integer }
              errorCode: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Submission:
      type: object
      required: [id, assignmentId, studentId, classId, status]
      properties:
        id: { type: string }
        assignmentId: { type: string }
        studentId: { type: string }
        classId: { type: string }
        answerText: { type: string }
        answers: { type: object, additionalProperties: { type: string } }
        transcription: { type: string }
        transcriptionConfirmed: { type: boolean }
        steps:
          type: array
          items: { $ref: "#/components/schemas/GenericObject" }
        score: { type: number }
        suggestedScore: { type: number }
        maxScore: { type: number }
        firstErrorStep: { type: string }
        errorCause: { type: string }
        confidence: { type: number }
        needsReview: { type: boolean }
        teacherNote: { type: string }
        scoreHistory:
          type: array
          items: { $ref: "#/components/schemas/GenericObject" }
        status:
          type: string
          enum: [submitted, queued, ocr_processing, awaiting_transcription_confirm, grading, needs_teacher_review, graded_suggested, teacher_final, failed_submission_kept, drafting, failed, graded]
        snapshots:
          type: array
          items: { $ref: "#/components/schemas/AnswerSnapshot" }
        aiUsageNote: { type: string }
        citations: { type: array, items: { type: string } }
        imageDigest: { type: string }
        objectiveOnly: { type: boolean }
        modelFailed: { type: boolean }
        studentVisibleDiag: { type: boolean }
        taskId: { type: string }
        idempotencyKey: { type: string }
        submittedAt: { type: string, format: date-time }
    AnswerSnapshot:
      type: object
      required: [version, content, createdAt, trigger]
      properties:
        version: { type: integer }
        content: { type: string }
        createdAt: { type: string, format: date-time }
        trigger: { type: string, enum: [interval, manual] }
    MistakeExplanation:
      type: object
      required: [mistakeId, questionStem, errorCause, hint, answerRevealed]
      properties:
        mistakeId: { type: string }
        questionStem: { type: string }
        errorCause: { type: string }
        hint: { type: string }
        answerRevealed: { type: boolean, enum: [false] }
    AttachmentReceipt:
      type: object
      required: [digest, contentType, size]
      properties:
        digest: { type: string, pattern: "^sha256:[0-9a-f]{64}$" }
        contentType: { type: string, enum: [image/jpeg, image/png, image/webp] }
        size: { type: integer, format: int64, maximum: 10485760 }
    EvidenceRef:
      type: object
      additionalProperties: false
      required: [materialId]
      properties:
        materialId: { type: string }
        chunkId: { type: string }
    CourseCardsRequest:
      type: object
      additionalProperties: false
      properties:
        topic: { type: string }
        count: { type: integer }
        cardCount: { type: integer }
        materialId: { type: string }
        sourceRefs: { type: array, items: { $ref: "#/components/schemas/EvidenceRef" } }
        idempotencyKey: { type: string }
    ExercisesRequest:
      type: object
      additionalProperties: false
      properties:
        topic: { type: string }
        count: { type: integer }
        questionCount: { type: integer }
        exerciseTypes: { type: array, items: { type: string } }
        questionTypes: { type: array, items: { type: string } }
        difficulty: { type: string }
        materialId: { type: string }
        sourceRefs: { type: array, items: { $ref: "#/components/schemas/EvidenceRef" } }
        idempotencyKey: { type: string }
    LessonPlanRequest:
      type: object
      additionalProperties: false
      properties:
        topic: { type: string }
        durationMinutes: { type: integer }
        objectives: { type: array, items: { type: string } }
        materialId: { type: string }
        sourceRefs: { type: array, items: { $ref: "#/components/schemas/EvidenceRef" } }
        idempotencyKey: { type: string }
    QualityReviewRequest:
      type: object
      additionalProperties: false
      properties:
        contentId: { type: string }
        kind: { type: string }
        payload: { type: object, additionalProperties: true }
        materialId: { type: string }
        sourceRefs: { type: array, items: { $ref: "#/components/schemas/EvidenceRef" } }
    ProductionContentStatus:
      type: string
      enum: [pending_confirmation, needs_revision, confirmed, published]
    GenerationResult:
      type: object
      required: [contentId, status, kind, version, replayed, content]
      properties:
        contentId: { type: string }
        status: { $ref: "#/components/schemas/ProductionContentStatus" }
        kind: { type: string }
        version: { type: integer }
        replayed: { type: boolean }
        content: { $ref: "#/components/schemas/ProductionContent" }
    ProductionContent:
      type: object
      required: [id, classId, createdBy, kind, status, version, revision, payload, citations, lastReview, usage, createdAt, updatedAt]
      properties:
        id: { type: string }
        classId: { type: string }
        createdBy: { type: string }
        kind: { type: string }
        status: { $ref: "#/components/schemas/ProductionContentStatus" }
        version: { type: integer }
        revision: { type: integer }
        payload: { type: object, additionalProperties: true }
        citations: { type: array, items: { $ref: "#/components/schemas/GenericObject" } }
        lastReview: { $ref: "#/components/schemas/GenericObject" }
        usage: { $ref: "#/components/schemas/GenericObject" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        confirmedBy: { type: string }
        confirmedAt: { type: string, format: date-time }
        publishedBy: { type: string }
        publishedAt: { type: string, format: date-time }
        frozenDigest: { type: string }
    SharedContent:
      type: object
      required: [id, skill, classId, status, payload, createdAt, updatedAt]
      properties:
        id: { type: string }
        skill: { $ref: "#/components/schemas/SkillID" }
        classId: { type: string }
        status: { type: string, enum: [generating, queued, pending, confirmed, rejected, published] }
        payload: { type: object, additionalProperties: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ConfirmContentRequest:
      type: object
      additionalProperties: false
      properties:
        payload: { type: object, additionalProperties: true }
    SkillID:
      type: string
      enum: [proposition, lesson_plan, preview_sheet, virtual_classroom, multimodal_grade, class_review, diagnosis, answer_replay, review_path, socratic_tutor, classroom_cluster, adaptive_practice]
    SkillMap:
      type: object
      additionalProperties: false
      properties:
        proposition: { type: boolean }
        lesson_plan: { type: boolean }
        preview_sheet: { type: boolean }
        virtual_classroom: { type: boolean }
        multimodal_grade: { type: boolean }
        class_review: { type: boolean }
        diagnosis: { type: boolean }
        answer_replay: { type: boolean }
        review_path: { type: boolean }
        socratic_tutor: { type: boolean }
        classroom_cluster: { type: boolean }
        adaptive_practice: { type: boolean }
    SimilarityReport:
      type: object
      required: [attemptId, evidence, note, verdict]
      properties:
        attemptId: { type: string }
        evidence:
          type: array
          items:
            type: object
            required: [fragment, source, similarity, location]
            properties:
              fragment: { type: string }
              source: { type: string }
              similarity: { type: number }
              location: { type: string }
        note: { type: string }
        verdict:
          description: Always null; the server does not make an automated misconduct verdict.
          nullable: true
    LearningState:
      type: object
      required: [studentId, classId, windowDays, knowledgePoints]
      properties:
        studentId: { type: string }
        classId: { type: string }
        windowDays: { type: integer, enum: [14] }
        knowledgePoints:
          type: array
          items:
            type: object
            required: [knowledgePoint, eventCount, evidenceCount, correctCount, incorrectCount, understoodCount, successRate, masteryLevel]
            properties:
              knowledgePoint: { type: string }
              eventCount: { type: integer }
              evidenceCount: { type: integer }
              correctCount: { type: integer }
              incorrectCount: { type: integer }
              understoodCount: { type: integer }
              successRate: { type: number }
              masteryLevel: { type: string, enum: [weak, developing, solid, insufficient_data] }
    ReviewStep:
      type: object
      required: [id, order, type, title, knowledgePoint, completed]
      properties:
        id: { type: string }
        order: { type: integer }
        type: { type: string }
        title: { type: string }
        detail: { type: string }
        knowledgePoint: { type: string }
        completed: { type: boolean }
        completedAt: { type: string, format: date-time }
    ReviewPlan:
      type: object
      required: [id, studentId, classId, status, steps, createdAt, updatedAt]
      properties:
        id: { type: string }
        studentId: { type: string }
        classId: { type: string }
        status: { type: string }
        steps: { type: array, items: { $ref: "#/components/schemas/ReviewStep" } }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ReviewPathResult:
      type: object
      required: [skipped]
      properties:
        skipped: { type: boolean }
        reason: { type: string }
        plan: { $ref: "#/components/schemas/ReviewPlan" }
    TutorTurn:
      type: object
      required: [round, reply, hit, createdAt]
      properties:
        round: { type: integer }
        reply: { type: string }
        hit: { type: boolean }
        prompt: { type: string }
        createdAt: { type: string, format: date-time }
    TutorSession:
      type: object
      required: [id, studentId, classId, questionId, questionStem, demo, round, hitStreak, maxRounds, answerReleased, history, createdAt, updatedAt]
      properties:
        id: { type: string }
        studentId: { type: string }
        classId: { type: string }
        questionId: { type: string }
        questionStem: { type: string }
        demo: { type: boolean }
        round: { type: integer }
        hitStreak: { type: integer }
        maxRounds: { type: integer }
        answerReleased: { type: boolean }
        releaseReason: { type: string }
        fullSolution: { type: string }
        prompt: { type: string }
        history: { type: array, items: { $ref: "#/components/schemas/TutorTurn" } }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    StartPracticeRequest:
      type: object
      additionalProperties: false
      required: [knowledgePoint]
      properties: { knowledgePoint: { type: string } }
    SessionRequest:
      type: object
      additionalProperties: false
      required: [sessionId]
      properties: { sessionId: { type: string } }
    PublicQuestion:
      type: object
      required: [id, knowledgePoint, difficulty, stem, verified]
      properties:
        id: { type: string }
        knowledgePoint: { type: string }
        difficulty: { type: string }
        stem: { type: string }
        verified: { type: boolean }
    PracticeReport:
      type: object
      required: [questionCount, correctCount, masteryEvidence, countsTowardGrade, finalKnowledgePoint]
      properties:
        questionCount: { type: integer }
        correctCount: { type: integer }
        masteryEvidence: { type: array, items: { type: string } }
        countsTowardGrade: { type: boolean, enum: [false] }
        finalKnowledgePoint: { type: string }
    PracticeResult:
      type: object
      required: [submissionId, outcome, transition, finished]
      properties:
        submissionId: { type: string }
        outcome: { type: string }
        transition: { type: string }
        finished: { type: boolean }
        finishReason: { type: string }
        question: { $ref: "#/components/schemas/PublicQuestion" }
        summary: { $ref: "#/components/schemas/PracticeReport" }
    PracticeSession:
      type: object
      required: [id, studentId, classId, knowledgePoint, difficulty, consecutiveCorrect, hardCorrect, questionCount, correctCount, hintsUsed, attempts, masteryEvidence, finished, createdAt, updatedAt]
      properties:
        id: { type: string }
        studentId: { type: string }
        classId: { type: string }
        knowledgePoint: { type: string }
        difficulty: { type: string }
        consecutiveCorrect: { type: integer }
        hardCorrect: { type: integer }
        questionCount: { type: integer }
        correctCount: { type: integer }
        hintsUsed: { type: integer }
        question: { $ref: "#/components/schemas/PublicQuestion" }
        attempts:
          type: array
          items: { $ref: "#/components/schemas/GenericObject" }
        masteryEvidence: { type: array, items: { type: string } }
        finished: { type: boolean }
        finishReason: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ClassroomInteraction:
      type: object
      required: [id, classId, teacherId, prompt, status, createdAt, updatedAt]
      properties:
        id: { type: string }
        classId: { type: string }
        teacherId: { type: string }
        prompt: { type: string }
        status: { type: string, enum: [open, closed] }
        analysis: { $ref: "#/components/schemas/ClassroomAnalysis" }
        createdAt: { type: string, format: date-time }
        closedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ClassroomAnalysis:
      type: object
      required: [skipped, answerCount, anonymous, countsAsGrade]
      properties:
        skipped: { type: boolean }
        reason: { type: string }
        mode: { type: string }
        answerCount: { type: integer }
        anonymous: { type: boolean, enum: [true] }
        countsAsGrade: { type: boolean, enum: [false] }
        clusters:
          type: array
          items:
            type: object
            required: [id, memberIds, size, label, followUp]
            properties:
              id: { type: string }
              memberIds: { type: array, items: { type: string } }
              size: { type: integer }
              label: { type: string }
              followUp: { type: string }
    MCPTool:
      type: object
      required: [name]
      properties:
        name: { type: string, enum: [formula_verify, assignment_stats, student_mistakes] }
        description: { type: string }
        inputSchema: { type: object, additionalProperties: true }
    MCPToolResult:
      type: object
      required: [tool, requestId, data]
      properties:
        tool: { type: string }
        requestId: { type: string }
        data: { type: object, additionalProperties: true }
    AuditEvent:
      type: object
      required: [id, actorId, classId, action, object, result, durationMs, requestId, createdAt]
      properties:
        id: { type: string }
        actorId: { type: string }
        classId: { type: string }
        action: { type: string }
        object: { type: string }
        result: { type: string }
        skill: { type: string }
        usage: { type: integer }
        durationMs: { type: integer, format: int64 }
        requestId: { type: string }
        detail: { type: object, additionalProperties: true }
        createdAt: { type: string, format: date-time }
  responses:
    GenericSuccess:
      description: Successful operation
      content:
        application/json:
          schema: { $ref: "#/components/schemas/GenericObject" }
    GenerationResult:
      description: Generated content; 200 means an idempotent replay
      content:
        application/json:
          schema: { $ref: "#/components/schemas/GenerationResult" }
    QualityReviewResult:
      description: Quality review
      content:
        application/json:
          schema: { $ref: "#/components/schemas/GenericObject" }
    PracticeSession:
      description: Practice session with a verified public question
      content:
        application/json:
          schema: { $ref: "#/components/schemas/PracticeSession" }
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Missing, invalid, expired or revoked session
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Authenticated but not permitted, or skill disabled
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Missing or out-of-scope resource
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: State, evidence or idempotency conflict
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    UnsupportedMediaType:
      description: Unsupported or missing Content-Type
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unprocessable:
      description: Content failed quality review
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    BadGateway:
      description: Model, review or MCP output was invalid
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unavailable:
      description: Required model, queue, storage, tutoring, MCP or persistence dependency unavailable
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
